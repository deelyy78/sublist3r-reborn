[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sublist3r-reborn"
version = "0.1.0"
description = "A clean-room, async rebirth of the legendary Sublist3r subdomain enumerator — with subdomain-takeover detection and an MCP server for AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Dili Fragio" }]
keywords = ["osint", "recon", "subdomain", "dns", "security", "mcp", "pentest"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=8"]

[project.scripts]
sublist3r-reborn = "sublist3r_reborn.cli:main"
sublist3r-reborn-mcp = "sublist3r_reborn.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sublist3r_reborn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
